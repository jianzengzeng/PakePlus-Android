/* ---- GF runtime ---- */
var THEME=GF.theme,TITLE=GF.title,AUTHOR=GF.author,DIFF=GF.diff,CAT=GF.cat;
var canvas=document.getElementById("game"),ctx=canvas.getContext("2d",{alpha:false});
var W=360,H=540,DPR=1,SAFE=8;
var FONT='"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif';
var _pt=Date.now(),T=0,DT=16,FRAME=0,globalTime=0;
function fit(){
  /* fill the viewport while keeping a 2:3 portrait stage; derive width from height on wide screens */
  var dpr=Math.min(window.devicePixelRatio||1,2);DPR=dpr;
  var aw=Math.max(200,window.innerWidth||360),ah=Math.max(300,window.innerHeight||540);
  var scale=Math.min(aw/360,ah/540);
  var W2=Math.round(360*scale),H2=Math.round(540*scale);
  if(W2>aw){W2=aw;H2=Math.round(W2*1.5);}
  if(H2>ah){H2=ah;W2=Math.round(H2/1.5);}
  W=Math.max(240,W2);H=Math.max(360,H2);
  if(Math.abs(W/H-2/3)>0.02){H=Math.round(W*1.5);if(H>ah){H=ah;W=Math.round(H/1.5);}}
  canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
  canvas.style.width=W+"px";canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(typeof onResize==="function")onResize();
}
/* color helpers */
function shade(hex,amt){var n=parseInt(String(hex).replace("#",""),16);if(isNaN(n))n=0x808080;
  var r=Math.max(0,Math.min(255,(n>>16)+amt)),g=Math.max(0,Math.min(255,((n>>8)&255)+amt)),b=Math.max(0,Math.min(255,(n&255)+amt));
  return "#"+((r<<16)|(g<<8)|b).toString(16).padStart(6,"0");}
function rgba(hex,a){var n=parseInt(String(hex).replace("#",""),16);if(isNaN(n))n=0x808080;
  return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")";}
function mixc(h1,h2,t){var a=parseInt(String(h1).replace("#",""),16),b=parseInt(String(h2).replace("#",""),16);
  var r=Math.round(((a>>16)&255)*(1-t)+((b>>16)&255)*t),g=Math.round(((a>>8)&255)*(1-t)+((b>>8)&255)*t),bl=Math.round((a&255)*(1-t)+(b&255)*t);
  return "#"+((r<<16)|(g<<8)|bl).toString(16).padStart(6,"0");}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function rnd(a,b){return a+Math.random()*(b-a);}
function ri(a,b){return Math.floor(a+Math.random()*(b-a+1));}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function rrect(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
  ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();}
function circle(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,6.2832);}
/* storage (degrades safely in private mode) */
function sv(k,v){try{localStorage.setItem("gf_"+k,JSON.stringify(v));}catch(e){}}
function ld(k,d){try{var v=localStorage.getItem("gf_"+k);return v===null?d:JSON.parse(v);}catch(e){return d;}}
/* audio: pure WebAudio synthesis, no external assets */
var AC=null,SFX=true;
function actx(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
  if(AC&&AC.state==="suspended"){try{AC.resume();}catch(e){}}return AC;}
function tone(f,dur,type,vol,slide){if(!SFX||!actx())return;try{
  var o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime;
  o.type=type||"square";o.frequency.setValueAtTime(f,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,slide),t0+dur);
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol||0.06,t0+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+dur+0.02);}catch(e){}}
function noise(dur,vol,hp){if(!SFX||!actx())return;try{
  var n=Math.floor(AC.sampleRate*dur),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0),i=0;
  for(i=0;i<n;i++){d[i]=(Math.random()*2-1)*Math.pow(1-i/n,1.7);}
  var s=AC.createBufferSource();s.buffer=b;var g=AC.createGain();g.gain.value=vol||0.07;
  var f=AC.createBiquadFilter();f.type="highpass";f.frequency.value=hp||300;
  s.connect(f);f.connect(g);g.connect(AC.destination);s.start();}catch(e){}}
function beep(n){var F=[523,587,659,784,880,988,1046,1175];tone(F[(n||0)%F.length],0.09,"triangle",0.05);}
function sBlip(){tone(880,0.055,"square",0.035,1320);}
function sPop(){tone(300,0.07,"sine",0.05,760);}
function sHit(){noise(0.13,0.075,420);tone(180,0.1,"sawtooth",0.045,70);}
function sWin(){[0,1,2,3].forEach(function(i){setTimeout(function(){beep(i+2);},i*95);});}
function sLose(){[0,1,2].forEach(function(i){setTimeout(function(){tone(320-i*70,0.19,"sawtooth",0.05,110);},i*140);});}
function sClick(){tone(660,0.035,"square",0.03);}
function vib(ms){try{if(navigator.vibrate)navigator.vibrate(ms||14);}catch(e){}}
/* particles */
var ps=[];
function burst(x,y,n,col,pw){n=n||10;pw=pw||3.4;var i=0;
  for(i=0;i<n;i++){var a=Math.random()*6.2832,s=rnd(pw*0.3,pw);
    ps.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-0.6,r:rnd(1.4,3.6),l:1,dc:rnd(0.014,0.03),c:col||THEME.accent,grav:0.09});}
  if(ps.length>170)ps.splice(0,ps.length-170);}
function sparks(x,y,n,col,ang,spread,pw){n=n||8;spread=spread||1.2;pw=pw||4.2;var i=0;
  for(i=0;i<n;i++){var a=ang+rnd(-spread,spread),s=rnd(pw*0.4,pw);
    ps.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:rnd(1.2,3),l:1,dc:rnd(0.018,0.036),c:col||THEME.accent,grav:0.14});}}
function upP(dt){var i=0,p=null;
  for(i=ps.length-1;i>=0;i--){p=ps[i];p.x+=p.vx*dt*0.055;p.y+=p.vy*dt*0.055;p.vy+=p.grav*dt*0.055;p.vx*=0.985;p.l-=p.dc*dt*0.06;
    if(p.l<=0)ps.splice(i,1);}}
function drP(){var i=0,p=null;ctx.save();ctx.globalCompositeOperation="lighter";
  for(i=0;i<ps.length;i++){p=ps[i];ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=p.c;circle(p.x,p.y,p.r*Math.max(0.3,p.l));ctx.fill();}
  ctx.globalAlpha=1;ctx.restore();}
/* floating text */
var fts=[];
function ftext(x,y,s,col,size){fts.push({x:x,y:y,s:String(s),c:col||"#fff",l:1,vy:-0.9,sz:size||15});
  if(fts.length>26)fts.shift();}
function upF(dt){var i=0;for(i=fts.length-1;i>=0;i--){var f=fts[i];f.y+=f.vy*dt*0.06;f.l-=dt*0.0016;if(f.l<=0)fts.splice(i,1);}}
function drF(){var i=0;ctx.save();ctx.textAlign="center";ctx.textBaseline="middle";
  for(i=0;i<fts.length;i++){var f=fts[i];ctx.globalAlpha=clamp(f.l,0,1);var sc=f.l>0.8?1+(f.l-0.8)*1.6:1;
    ctx.font="800 "+(f.sz*sc).toFixed(1)+"px "+FONT;ctx.lineWidth=3;ctx.strokeStyle="rgba(0,0,0,0.55)";ctx.strokeText(f.s,f.x,f.y);
    ctx.fillStyle=f.c;ctx.fillText(f.s,f.x,f.y);}
  ctx.globalAlpha=1;ctx.restore();}
/* screen shake */
var shk=0;function shake(v){shk=Math.max(shk,v);}
function upShake(dt){if(shk>0)shk=Math.max(0,shk-dt*0.032);}
/* screen flash */
var fla=0;function flash(v){fla=Math.max(fla,v||0.5);}
function upFlash(dt){if(fla>0)fla=Math.max(0,fla-dt*0.0035);}
function drFlash(){if(fla>0){ctx.save();ctx.globalAlpha=fla*0.65;ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);ctx.restore();}}
/* floating toast */
var toastTxt="",toastL=0;
function say(s,ms){toastTxt=s;toastL=ms||1100;}
function upToast(dt){if(toastL>0)toastL-=dt;}
function drToast(){if(toastL<=0)return;var a=clamp(toastL/420,0,1);
  ctx.save();ctx.globalAlpha=Math.min(1,a)*0.94;ctx.font="700 13px "+FONT;ctx.textAlign="center";ctx.textBaseline="middle";
  var tw=ctx.measureText(toastTxt).width+30;
  ctx.fillStyle="rgba(7,4,24,0.9)";rrect((W-tw)/2,H*0.16,tw,34,17);ctx.fill();
  ctx.strokeStyle=rgba(THEME.accent,0.6);ctx.lineWidth=1.4;ctx.stroke();

/* tap areas: taps holds buttons drawn this frame, tapsPrev is the copy from last frame used for hit testing */
var taps=[],tapsPrev=[];
function addTap(x,y,w,h,f){taps.push({x:x,y:y,w:w,h:h,f:f});}
function syncTaps(){tapsPrev=taps.slice(0);taps.length=0;}
function hitTap(x,y){var i=0,list=tapsPrev.length?tapsPrev:taps;
  for(i=list.length-1;i>=0;i--){var a=list[i];

/* game buttons */
function drawBtn(x,y,w,h,label,c1,c2,sub){

  var g=ctx.createLinearGradient(x,y,x,y+h);g.addColorStop(0,c1);g.addColorStop(1,c2);

var bgStars=[],bgT=0;
function initBG(){bgStars=[];var i=0;for(i=0;i<80;i++)bgStars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+0.2,a:Math.random()*0.5+0.2,s:Math.random()*0.02+0.005,p:Math.random()*6.28});}
function drawBG(dt){
  bgT+=(dt||16)*0.0005;
  var A=THEME.accent,B=THEME.accent2,BG=GF.bg,i=0,s=null;
  /* custom background image from the setup panel takes priority */
  if(GF.bgImg){
    var bi=GF.bgImg,bw=bi.width,bh=bi.height,bs=Math.max(W/bw,H/bh);
    ctx.drawImage(bi,(W-bw*bs)/2,(H-bh*bs)/2,bw*bs,bh*bs);

    bo.addColorStop(0,"rgba(2,1,10,0.66)");bo.addColorStop(0.55,"rgba(2,1,10,0.52)");bo.addColorStop(1,"rgba(2,1,10,0.74)");
    ctx.fillStyle=bo;ctx.fillRect(0,0,W,H);
    return;}
  var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,THEME.bg1);g.addColorStop(1,THEME.bg2);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(BG==="nebula"){
    var blobs=[{x:0.25,y:0.3,c:A},{x:0.75,y:0.6,c:B},{x:0.5,y:0.85,c:A},{x:0.15,y:0.7,c:B}];
    for(i=0;i<blobs.length;i++){
      var bb=blobs[i];
      var x=bb.x*W+Math.sin(bgT+i*2)*60,y=bb.y*H+Math.cos(bgT*0.7+i)*40;
      var rr=Math.max(W,H)*0.6;

      bg2.addColorStop(0,bb.c+"55");bg2.addColorStop(0.4,bb.c+"22");bg2.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=bg2;ctx.fillRect(0,0,W,H);}
  } else if(BG==="aurora"){
    for(i=0;i<3;i++){
      var yBase=H*0.3+i*H*0.15;
      ctx.beginPath();
      for(var x2=0;x2<=W;x2+=10){
        var y2=yBase+Math.sin(x2*0.02+bgT*2+i)*40+Math.sin(x2*0.005+i)*30;
        if(x2===0)ctx.moveTo(x2,y2);else ctx.lineTo(x2,y2);}
      ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();
      var ag=ctx.createLinearGradient(0,yBase-50,0,H);
      var ac=(i===0)?A:((i===1)?B:THEME.star);
      ag.addColorStop(0,ac+"88");ag.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=ag;ctx.fill();}
  } else if(BG==="particles"){
    ctx.save();
    for(i=0;i<30;i++){
      var px=(i*337+bgT*30*60)%W,py=(i*173+bgT*20*60)%H;
      var c=(i%2===0)?A:B;
      ctx.globalAlpha=0.3+0.5*Math.abs(Math.sin(bgT*3+i));
      ctx.fillStyle=c;ctx.shadowColor=c;ctx.shadowBlur=10;
      circle(px,py,2);ctx.fill();}
    ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.restore();
  } else if(BG==="rain"){
    ctx.save();ctx.strokeStyle=A;ctx.lineWidth=1.2;ctx.globalAlpha=0.4;
    for(i=0;i<40;i++){
      var rx=(i*151+(bgT*60)%40)%W;
      var ry=((i*97+bgT*260*60/60)%(H+80))-40;
      ctx.beginPath();ctx.moveTo(rx,ry);ctx.lineTo(rx-3,ry+14);ctx.stroke();}
    ctx.globalAlpha=1;ctx.restore();
  } else if(BG==="rings"){
    ctx.save();ctx.strokeStyle=A;ctx.globalAlpha=0.22;
    for(i=1;i<7;i++){
      ctx.lineWidth=1.6;ctx.beginPath();
      circle(W/2,H*0.45,Math.min(W,H)*(0.08*i+Math.sin(bgT*1.4+i)*0.012));ctx.stroke();}
    ctx.globalAlpha=1;ctx.restore();
  } else if(BG==="bokeh"){
    ctx.save();
    for(i=0;i<14;i++){
      var bx=(i*211)%W,by=((i*143+bgT*22*60/60)%(H+120))-60;
      ctx.globalAlpha=0.10;ctx.fillStyle=(i%2)?A:B;
      circle(bx,by,14+((i*7)%5)*8);ctx.fill();}

  } else if(BG==="stripes"){
    ctx.save();ctx.globalAlpha=0.10;ctx.strokeStyle=A;ctx.lineWidth=10;

    ctx.globalAlpha=1;ctx.restore();
  } else {
    ctx.strokeStyle=A+"22";ctx.lineWidth=1;
    for(i=0;i<W;i+=40){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.stroke();}
    for(i=0;i<H;i+=40){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(W,i);ctx.stroke();}
  }
  for(i=0;i<bgStars.length;i++){
    s=bgStars[i];
    s.y+=s.s*(dt||16)*0.06;
    if(s.y>H+5){s.y=-5;s.x=Math.random()*W;}
    s.p+=((dt||16)*0.003);

    ctx.fillStyle=THEME.star;circle(s.x,s.y,s.r);ctx.fill();}
  ctx.globalAlpha=1;}

        var an=Math.PI/3*hv+t*0.12;
        var vx3=hx+Math.cos(an)*hr,vy3=hy+Math.sin(an)*hr;
        if(hv)ctx.lineTo(vx3,vy3);else ctx.moveTo(vx3,vy3);}
      ctx.closePath();ctx.stroke();ctx.restore();}}
  for(i=0;i<60;i++){
    var sx=(i*137.5)%W,sy=(i*77.3)%H;
    ctx.globalAlpha=0.3+0.7*Math.abs(Math.sin(t*2+i));
    ctx.fillStyle=(i%3===0)?THEME.accent:THEME.star;
    circle(sx,sy,1.2+((i*13)%7)*0.05);ctx.fill();}
  ctx.globalAlpha=1;
  var colorGlow=ctx.createRadialGradient(W*0.5,H*0.4,0,W*0.5,H*0.4,R*1.3);
  colorGlow.addColorStop(0,THEME.accent+"33");
  colorGlow.addColorStop(0.5,THEME.accent2+"11");
  colorGlow.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=colorGlow;ctx.fillRect(0,0,W,H);
  var tg=ctx.createRadialGradient(W/2,H*0.25,0,W/2,H*0.25,R*0.8);
  tg.addColorStop(0,"rgba(0,0,0,0)");tg.addColorStop(1,"rgba(0,0,0,0.5)");
  ctx.fillStyle=tg;ctx.fillRect(0,0,W,H);}
/* title text (stroke + gradient + shadow) */
function drawTitle(words,cy,size){
  ctx.save();ctx.textAlign="center";ctx.textBaseline="middle";size=size||34;
  var i=0;for(i=0;i<words.length;i++){
    var y=cy+i*(size*1.16),sc=size*(i===0?1:1.06);
    ctx.font="900 "+sc.toFixed(1)+"px "+FONT;
    ctx.shadowColor=i===0?A0():A1();ctx.shadowBlur=26;
    ctx.fillStyle=i===0?"rgba(255,255,255,0.34)":rgba(A1(),0.4);ctx.fillText(words[i],W/2,y);
    ctx.shadowBlur=0;
    var tg=ctx.createLinearGradient(0,y-sc,0,y+sc);
    tg.addColorStop(0,i===0?"#ffffff":shade(A1(),70));tg.addColorStop(0.55,i===0?A0():A1());tg.addColorStop(1,i===0?shade(A0(),-30):shade(A1(),-40));
    ctx.fillStyle=tg;ctx.lineWidth=3.4;ctx.strokeStyle="rgba(3,1,12,0.6)";ctx.strokeText(words[i],W/2,y);ctx.fillText(words[i],W/2,y);}
  ctx.restore();}
function A0(){return THEME.accent;}function A1(){return THEME.accent2;}
/* level map (40 levels, 5x8) */
function drawLevels(unlocked,cur,title){
  var cols=5,i=0,lvl=0,un=false;
  frameUI({title:title||"SELECT LEVEL",label2:"UNLOCKED "+unlocked+"/40"});
  var gw=W-24,top=SAFE+62;
  var cw=gw/cols,ch=Math.min(52,(H-top-30)/8);
  for(i=0;i<40;i++){var r=Math.floor(i/cols),c=i%cols;lvl=i+1;un=lvl<=unlocked;
    var x=12+c*cw+3,y=top+r*ch+3,w=cw-6,h=ch-6;
    ctx.save();
    if(un){ctx.shadowColor=(lvl===cur)?"#ffcc44":A0();ctx.shadowBlur=(lvl===cur)?16:7;
      var g=ctx.createLinearGradient(x,y,x,y+h);
      if(lvl===cur){g.addColorStop(0,"#ffd166");g.addColorStop(1,"#ff8c1a");}
      else{g.addColorStop(0,rgba(A0(),0.95));g.addColorStop(1,shade(A0(),-70));}
      ctx.fillStyle=g;}else{ctx.fillStyle="rgba(255,255,255,0.07)";}
    rrect(x,y,w,h,9);ctx.fill();ctx.shadowBlur=0;
    if(lvl%10===0&&un){ctx.strokeStyle="#ffd166";ctx.lineWidth=1.8;rrect(x,y,w,h,9);ctx.stroke();}
    ctx.textAlign="center";ctx.textBaseline="middle";
    if(un){ctx.fillStyle=lvl===cur?"#150a02":"#fff";ctx.font="800 "+(h>40?17:14)+"px "+FONT;ctx.fillText(String(lvl),x+w/2,y+h/2);}
    else{ctx.fillStyle="rgba(255,255,255,0.22)";ctx.font="14px "+FONT;ctx.fillText("🔒",x+w/2,y+h/2);}
    ctx.restore();
    if(un)addTap(x,y,w,h,(function(l){return function(){sClick();startLevel(l);};})(lvl));}
  iconBtn(W-SAFE-22,SAFE+40,15,"home",THEME.accent,function(){screen="menu";sClick();});}
/* result panels (engines trigger via showWin / showLose) */
function drawWinPanel(level,score,extra){
  ctx.save();ctx.fillStyle="rgba(4,2,14,0.8)";ctx.fillRect(0,0,W,H);ctx.restore();
  var p=1+Math.sin(T*0.005)*0.04;
  ctx.save();ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.shadowColor="#3dffa0";ctx.shadowBlur=30;ctx.fillStyle="#3dffa0";

function drawLosePanel(level,score,best,reason){
  ctx.save();ctx.fillStyle="rgba(4,2,14,0.85)";ctx.fillRect(0,0,W,H);ctx.restore();
  ctx.save();ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.shadowColor="#ff3355";ctx.shadowBlur=26;ctx.fillStyle="#ff3355";
  ctx.font="900 32px "+FONT;ctx.fillText("GAME OVER",W/2,H*0.26);
  ctx.shadowBlur=0;ctx.fillStyle="rgba(255,255,255,0.72)";ctx.font="700 13px "+FONT;

  ctx.fillStyle="#fff";ctx.font="900 30px "+FONT;ctx.fillText(String(score),W/2,H*0.41);

  ctx.restore();
  var bw=Math.min(230,W-76),bh=52,bx=(W-bw)/2;

  tapBtn(bx,H*0.55+62,bw,bh,"LEVEL MAP",THEME.accent,shade(THEME.accent,-70),"LEVEL SELECT",function(){sClick();screen="levels";});
  tapBtn(bx,H*0.55+124,bw,44,"MENU","#6b7699","#333a55",null,function(){sClick();screen="menu";});}
/* level progress / score / result API */
var CURRENT_LEVEL=1,score=0,unlocked=1,best=0,totalScore=0,runTime=0;
function loadProgress(){unlocked=clamp(ld("unlocked",1)|0,1,40);best=ld("best",0)|0;totalScore=ld("total",0)|0;}
function saveProgress(){sv("unlocked",unlocked);sv("best",best);sv("total",totalScore);}
function resetRun(){score=0;runTime=0;}
function addScore(n){score+=Math.round(n);if(score>best){best=score;}}
function startLevel(l){CURRENT_LEVEL=clamp(l|0,1,40);ps.length=0;fts.length=0;shk=0;fla=0;toastL=0;
  resetRun();if(typeof onLevelStart==="function")onLevelStart(CURRENT_LEVEL);
  taps.length=0;screen="playing";_pt=Date.now();}
function showWin(extra){if(CURRENT_LEVEL>=unlocked&&unlocked<40){unlocked=CURRENT_LEVEL+1;}
  totalScore+=score;saveProgress();sWin();vib(30);
  if(typeof onWin==="function")onWin();screen="win";return true;}
function showLose(reason){saveProgress();sLose();vib(60);
  if(typeof onLose==="function")onLose(reason||"");loseReason=reason||"";screen="over";return true;}
var loseReason="";
window.showLose = showLose;
window.showWin = showWin;
function isPlay(){return screen==="playing";}
function playTime(){runTime+=DT;return runTime;}
/* shared difficulty curve: returns 0..1 level progress */
function prog(){return (CURRENT_LEVEL-1)/39;}
/* main menu skeleton (engines may add their own decoration) */
function drawMenuBase(sub,extraY){
  drawCover(T*0.001);
  var words=TITLE.toUpperCase().split(" ");if(words.length<2)words=[TITLE.toUpperCase(),""];
  var cy=H*0.44;
  drawTitle([words[0],words.slice(1).join(" ")],cy,Math.min(36,W*0.1));
  ctx.save();ctx.textAlign="center";ctx.textBaseline="middle";ctx.font="700 11px "+FONT;ctx.fillStyle=rgba("#ffffff",0.6);
  ctx.fillText(sub||"40 LEVELS · TAP TO START",W/2,cy+Math.min(36,W*0.1)*1.5);ctx.restore();
  var bw=Math.min(240,W-70),bh=56,bx=(W-bw)/2,by=H*0.66+(extraY||0);
  tapBtn(bx,by,bw,bh,"START",THEME.accent,shade(THEME.accent,-80),"DIFFICULTY "+DIFF.name,function(){sClick();startLevel(1);});
  tapBtn(bx,by+bh+11,bw,44,"LEVEL MAP",rgba("#ffffff",0.16),rgba("#ffffff",0.06),null,function(){sClick();screen="levels";});
  ctx.save();ctx.textAlign="center";ctx.font="600 10px "+FONT;ctx.fillStyle=rgba("#ffffff",0.36);
  ctx.fillText((AUTHOR?("© "+AUTHOR+" · "):"")+"DIFFICULTY x"+DIFF.scale.toFixed(2),W/2,H-18);ctx.restore();}
/* unified pointer / keyboard input */
function evPos(e){var r=canvas.getBoundingClientRect(),cx=0,cy=0;
  if(e.touches&&e.touches.length){cx=e.touches[0].clientX;cy=e.touches[0].clientY;}
  else if(e.changedTouches&&e.changedTouches.length){cx=e.changedTouches[0].clientX;cy=e.changedTouches[0].clientY;}
  else{cx=e.clientX;cy=e.clientY;}
  return {x:(cx-r.left)*(W/r.width),y:(cy-r.top)*(H/r.height)};}
/* pointer down: UI hit test first (against last frame buttons), then hand off to the engine */
function onDown(x,y){
  actx();
  /* ：， */
  if(screen==="pause"){screen="playing";sClick();return;}
  if(hitTap(x,y))return;
  if(typeof tapDown==="function")tapDown(x,y);}
function onUpF(x,y){if(typeof tapUp==="function")tapUp(x,y);}
function bindInput(){
  var opt={passive:false};
  canvas.addEventListener("touchstart",function(e){e.preventDefault();var p=evPos(e);onDown(p.x,p.y);},opt);
  canvas.addEventListener("touchmove",function(e){e.preventDefault();var p=evPos(e);if(typeof tapMove==="function")tapMove(p.x,p.y);},opt);
  canvas.addEventListener("touchend",function(e){e.preventDefault();var p=evPos(e);onUpF(p.x,p.y);},opt);
  var holding=false;
  canvas.addEventListener("mousedown",function(e){holding=true;var p=evPos(e);onDown(p.x,p.y);});
  canvas.addEventListener("mousemove",function(e){if(!holding)return;var p=evPos(e);if(typeof tapMove==="function")tapMove(p.x,p.y);});
  canvas.addEventListener("mouseup",function(e){holding=false;var p=evPos(e);onUpF(p.x,p.y);});
  canvas.addEventListener("mouseleave",function(){holding=false;});
  window.addEventListener("keydown",function(e){
    if(e.key===" "||e.key==="Enter"){e.preventDefault();onDown(W/2,H/2);return;}
    if(typeof keyDown==="function")keyDown(e.key);
  });
  document.addEventListener("visibilitychange",function(){if(document.hidden&&screen==="playing"){screen="pause";}});
  window.addEventListener("resize",function(){fit();initBG();});
  window.addEventListener("orientationchange",function(){setTimeout(function(){fit();initBG();},260);});
}
/* shared update / render / main loop */
var screen="menu";
function loop(ts){
  var now=ts||Date.now();DT=Math.min(52,Math.max(8,now-_pt));_pt=now;T=now;FRAME++;globalTime+=DT;
  if(typeof updateScreen==="function")updateScreen(DT);
  upP(DT);upF(DT);upShake(DT);upFlash(DT);upToast(DT);
  if(typeof globalUpdate==="function")globalUpdate(DT);
  ctx.save();
  if(shk>0){var s=Math.min(shk,14);ctx.translate((Math.random()-0.5)*s,(Math.random()-0.5)*s);}
  if(typeof renderScreen==="function")renderScreen(DT);
  ctx.restore();
  drP();drF();drFlash();drToast();
  if(typeof renderTop==="function")renderTop();
  /*  EXIT ：， */
  if(screen==="playing"||screen==="pause"||screen==="win"||screen==="over"||screen==="levels"){
    if(typeof drawExitBtn==="function")drawExitBtn();}
  syncTaps();
  requestAnimationFrame(loop);}
/* boot */
function boot(){
  fit();initBG();taps.length=0;tapsPrev=[];
  if(typeof onResize==="function")onResize();
  bindInput();
  requestAnimationFrame(loop);}
var BX=0,BY=0,BC=0;
function boardFit(n){var m=((8)*W/360);var availW=W-2*m;var top=SAFE+56;var availH=H-top-((16)*W/360);
  BC=Math.floor(Math.min(availW/n,availH/n));BX=Math.round((W-n*BC)/2);BY=Math.round(top+(availH-n*BC)/2*0.42);}
function cx(i){return BX+i*BC+BC/2;}function cy(j){return BY+j*BC+BC/2;}
function pad(c,r,n){return {x:BX+c*BC+2,y:BY+r*BC+2,w:BC-4,h:BC-4};}
var ICONS=["🍎","🍇","🍋","🍒","🥝","🍑","🍍","🥥","🌶","🍄","⭐","💎","🔮","🎲"];
var G=[],ROWS=4,COLS=6,sel=null,timeLeft=60,combo=0,comboT=0,path=null,pathT=0,hintT=0,hint=null;
function onLevelStart(){
  var p=prog();
  ROWS=clamp(3+Math.round(p*3),3,6);
  COLS=clamp(4+Math.round(p*4),4,8);
  if((ROWS*COLS)%2)COLS--;
  var kinds=clamp(3+Math.round(p*5),3,ICONS.length);
  var pool=[],i=0;for(i=0;i<ROWS*COLS/2;i++)pool.push(i%kinds);
  pool=pool.concat(pool.slice());
  for(i=pool.length-1;i>0;i--){var j=ri(0,i),t=pool[i];pool[i]=pool[j];pool[j]=t;}
  G=[];var k=0;for(i=0;i<ROWS;i++){var row=[];for(k=0;k<COLS;k++)row.push(pool[i*COLS+k]);G.push(row);}
  boardFit(COLS);sel=null;path=null;combo=0;hint=null;hintT=0;
  timeLeft=Math.round(80-p*28-DIFF.scale*8);
  say(COLS+"×"+ROWS+" · "+kinds+"PATTERN",1200);}
function alive(){var i=0,j=0;for(i=0;i<G.length;i++)for(j=0;j<G[i].length;j++)if(G[i][j]>=0)return true;return false;}
function hline(r,c1,c2){var c=0;if(c1>c2){var t=c1;c1=c2;c2=t;}for(c=c1;c<=c2;c++)if(G[r][c]>=0)return false;return true;}
function vline(c,r1,r2){var r=0;if(r1>r2){var t=r1;r1=r2;r2=t;}for(r=r1;r<=r2;r++)if(G[r][c]>=0)return false;return true;}
function linkTest(a,b){
  var r1=a[0],c1=a[1],r2=b[0],c2=b[1],R=G.length,C=G[0].length,i=0;
  if(r1===r2&&hline(r1,c1,c2))return [[r1,c1],[r2,c2]];
  if(c1===c2&&vline(c1,r1,r2))return [[r1,c1],[r2,c2]];
  if(G[r1][c2]<0&&G[r2][c1]<0){
    if(hline(r1,Math.min(c1,c2),Math.max(c1,c2))&&vline(c2,Math.min(r1,r2),Math.max(r1,r2)))return [[r1,c1],[r1,c2],[r2,c2]];
    if(vline(c1,Math.min(r1,r2),Math.max(r1,r2))&&hline(r2,Math.min(c1,c2),Math.max(c1,c2)))return [[r1,c1],[r2,c1],[r2,c2]];}
  for(i=0;i<C;i++){if(i===c1||i===c2)continue;
    if(G[r1][i]<0&&G[r2][i]<0&&hline(r1,Math.min(c1,i),Math.max(c1,i))&&hline(r2,Math.min(c2,i),Math.max(c2,i))&&vline(i,Math.min(r1,r2),Math.max(r1,r2)))
      return [[r1,c1],[r1,i],[r2,i],[r2,c2]];}
  for(i=0;i<R;i++){if(i===r1||i===r2)continue;
    if(G[i][c1]<0&&G[i][c2]<0&&vline(c1,Math.min(r1,i),Math.max(r1,i))&&vline(c2,Math.min(r2,i),Math.max(r2,i))&&hline(i,c1,c2))
      return [[r1,c1],[i,c1],[i,c2],[r2,c2]];}
  return null;}
function remain(){var n=0,i=0,j=0;for(i=0;i<G.length;i++)for(j=0;j<G[i].length;j++)if(G[i][j]>=0)n++;return n;}
function findHint(){var open=[],r=0,c=0,i=0,j=0;
  for(r=0;r<G.length;r++)for(c=0;c<G[r].length;c++)if(G[r][c]>=0)open.push([r,c]);
  for(i=0;i<open.length;i++)for(j=i+1;j<open.length;j++){
    if(G[open[i][0]][open[i][1]]!==G[open[j][0]][open[j][1]])continue;
    var p=linkTest(open[i],open[j]);if(p)return [open[i],open[j],p];}
  return null;}
function tapDown(x,y){
  if(screen!=="playing"){hitTap(x,y);return;}
  var c=Math.floor((x-BX)/BC),r=Math.floor((y-BY)/BC);
  if(r<0||r>=G.length||c<0||c>=G[0].length)return;
  if(G[r][c]<0)return;
  if(!sel){sel=[r,c];sBlip();return;}
  if(sel[0]===r&&sel[1]===c){sel=null;return;}
  if(G[sel[0]][sel[1]]!==G[r][c]){sel=[r,c];sBlip();shake(3);return;}
  var p=linkTest(sel,[r,c]);
  if(p){path=p;pathT=520;combo++;comboT=1500;
    var gain=20*Math.min(combo,8)+CURRENT_LEVEL*3;
    addScore(gain);
    burst(cx(c),cy(r),9,THEME.accent2,3.4);burst(cx(sel[1]),cy(sel[0]),9,THEME.accent,3.4);sPop();vib(16);
    ftext(cx(c),cy(r),"+ "+gain,"#ffd166");
    G[sel[0]][sel[1]]=-1;G[r][c]=-1;sel=null;hint=null;
    if(!alive()){addScore(180+CURRENT_LEVEL*22);showWin("LEFT"+Math.round(timeLeft)+"S");}}
  else{sHit();shake(4);combo=0;sel=[r,c];}}
function updateScreen(dt){
  if(screen==="levels"){taps.length=0;drawLevels(unlocked,CURRENT_LEVEL,TITLE);return;}
  if(pathT>0)pathT-=dt;
  if(screen!=="playing")return;
  timeLeft-=dt*0.001;
  if(comboT>0){comboT-=dt;if(comboT<=0)combo=0;}
  hintT+=dt;
  if(timeLeft<=0){timeLeft=0;showLose("TIME UP · LEFT"+remain()+" ");return;}
  if(hintT>4200&&!hint){hint=findHint();hintT=0;}}
function renderScreen(dt){
  if(screen==="menu"){drawMenuBase("MATCH AND LINK · TIME ATTACK · COMBO BONUS");return;}
  if(screen==="win"){drawWinPanel(CURRENT_LEVEL,score,"LEFT"+remain()+" ");return;}
  if(screen==="over"){drawLosePanel(CURRENT_LEVEL,score,best,loseReason);return;}
  if(screen!=="playing")return;
  drawBG(dt);boardFit(G[0]?G[0].length:COLS);
  var i=0,j=0;
  for(i=0;i<G.length;i++)for(j=0;j<G[i].length;j++){
    var p=pad(j,i,G[i].length),v=G[i][j];
    var isSel=sel&&sel[0]===i&&sel[1]===j;
    var isHint=hint&&((hint[0][0]===i&&hint[0][1]===j)||(hint[1][0]===i&&hint[1][1]===j));
    ctx.save();
    if(v<0){ctx.fillStyle="rgba(255,255,255,0.03)";rrect(p.x,p.y,p.w,p.h,((6)*W/360));ctx.fill();ctx.restore();continue;}
    if(isSel){ctx.shadowColor=THEME.accent2;ctx.shadowBlur=16;}else if(isHint){ctx.shadowColor="#ffd166";ctx.shadowBlur=12;}
    var g=ctx.createLinearGradient(p.x,p.y,p.x,p.y+p.h);
    g.addColorStop(0,isSel?rgba(THEME.accent2,0.95):"rgba(255,255,255,0.16)");
    g.addColorStop(1,isSel?rgba(THEME.accent2,0.5):"rgba(255,255,255,0.05)");
    ctx.fillStyle=g;rrect(p.x,p.y,p.w,p.h,((7)*W/360));ctx.fill();ctx.shadowBlur=0;
    ctx.textAlign="center";ctx.textBaseline="middle";ctx.font=Math.round(p.h*0.56)+"px "+FONT;
    ctx.fillText(ICONS[v%ICONS.length],p.x+p.w/2,p.y+p.h/2+1);ctx.restore();}
  if(path&&pathT>0){ctx.save();ctx.globalAlpha=clamp(pathT/520,0,1);
    ctx.strokeStyle=THEME.accent;ctx.lineWidth=((3)*W/360);ctx.lineCap="Round";ctx.lineJoin="Round";
    ctx.shadowColor=THEME.accent;ctx.shadowBlur=14;ctx.beginPath();
    for(i=0;i<path.length;i++){var px=cx(path[i][1]),py=cy(path[i][0]);i?ctx.lineTo(px,py):ctx.moveTo(px,py);}
    ctx.stroke();ctx.restore();}
  hudBar({icon:"🔗",title:TITLE,score:score,label2:"LEFT"+Math.ceil(timeLeft)+"S · CARDS"+remain(),progress:clamp(timeLeft/80,0,1)});
  if(combo>1){ctx.save();ctx.textAlign="center";ctx.font="800 15px "+FONT;ctx.fillStyle="#ffd166";
    ctx.fillText("COMBO x"+combo,W/2,SAFE+((62)*W/360));ctx.restore();}
  iconBtn(SAFE+((20)*W/360),SAFE+((20)*W/360),((13)*W/360),"pause",THEME.accent,function(){screen="pause";});}
boot();
})();
