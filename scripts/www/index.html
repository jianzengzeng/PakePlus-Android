<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Star Trail</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #050510;
    font-family: 'Orbitron', 'Segoe UI', system-ui, sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas { display: block; margin: 0 auto; touch-action: none; }
  /* ─── HUD ─── */
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between;
    padding: 16px 24px;
    pointer-events: none; z-index: 10;
    opacity: 0; transition: opacity 0.4s;
  }
  #hud.active { opacity: 1; }
  #hud .stat {
    color: #e0e0ff; font-size: 16px; font-weight: 700;
    letter-spacing: 2px; text-shadow: 0 0 12px rgba(100,150,255,0.6);
  }
  #hud .stat span { color: #7ee8fa; font-size: 20px; margin-left: 6px; }
  #hud .stat.warning span { color: #ff6b6b; text-shadow: 0 0 12px rgba(255,100,100,0.8); }
  /* ─── Overlays ─── */
  .overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 20; text-align: center; padding: 30px;
    transition: opacity 0.5s ease, visibility 0.5s;
  }
  .overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  /* 主菜单：只设背景和溢出，不要设 position */
  #menu {
    background: radial-gradient(ellipse at 50% 30%, #1a1a3a 0%, #050510 80%);
    overflow: hidden;
  }
  #coverCanvas {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%; z-index: 0;
  }
  .menu-content {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  #menu h1 {
    font-size: 44px; font-weight: 900; color: #fff;
    letter-spacing: 6px; margin-bottom: 8px;
    text-shadow: 0 0 30px rgba(100,180,255,0.8), 0 0 60px rgba(100,180,255,0.4);
    animation: titlePulse 3s ease-in-out infinite;
  }
  @keyframes titlePulse {
    0%, 100% { text-shadow: 0 0 30px rgba(100,180,255,0.8), 0 0 60px rgba(100,180,255,0.4); }
    50% { text-shadow: 0 0 50px rgba(100,180,255,1), 0 0 90px rgba(100,180,255,0.6); }
  }
  #menu .subtitle {
    color: #7ee8fa; font-size: 13px; letter-spacing: 4px;
    margin-bottom: 40px; opacity: 0.8;
  }
  #menu .instructions {
    color: #8a8ab0; font-size: 13px; line-height: 2;
    margin-bottom: 40px; text-shadow: 0 0 10px rgba(0,0,0,0.8);
  }
  #menu .best-score {
    color: #ffd166; font-size: 14px; letter-spacing: 2px;
    margin-bottom: 30px; text-shadow: 0 0 15px rgba(255,209,102,0.5);
  }
  .btn {
    padding: 16px 60px;
    font-family: 'Orbitron', 'Segoe UI', system-ui, sans-serif;
    font-size: 18px; font-weight: 700; letter-spacing: 3px;
    color: #050510;
    background: linear-gradient(135deg, #7ee8fa, #5b8cff);
    border: none; border-radius: 50px; cursor: pointer;
    box-shadow: 0 0 30px rgba(100,150,255,0.6), 0 0 60px rgba(100,150,255,0.2);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn:active { transform: scale(0.94); box-shadow: 0 0 15px rgba(100,150,255,0.9); }
  #gameover { background: rgba(5,5,20,0.92); }
  #gameover h2 {
    font-size: 36px; font-weight: 900; color: #ff6b6b;
    letter-spacing: 6px; margin-bottom: 30px;
    text-shadow: 0 0 30px rgba(255,100,100,0.8);
  }
  #gameover .final-score {
    font-size: 72px; font-weight: 900; color: #7ee8fa;
    line-height: 1; margin-bottom: 8px;
    text-shadow: 0 0 40px rgba(100,180,255,0.8);
  }
  #gameover .label {
    color: #8a8ab0; font-size: 12px;
    letter-spacing: 3px; margin-bottom: 30px;
  }
  #gameover .best-score {
    color: #ffd166; font-size: 14px; letter-spacing: 2px;
    margin-bottom: 30px; text-shadow: 0 0 15px rgba(255,209,102,0.5);
  }
  /* 版本号：用于确认文件是否更新 */
  #versionTag {
    position: fixed; top: 6px; left: 8px;
    color: #555; font-size: 10px;
    z-index: 9999; pointer-events: none;
  }
</style>
</head>
<body>

<div id="versionTag">v2.0</div>

<div id="hud">
  <div class="stat">SCORE <span id="scoreVal">0</span></div>
  <div class="stat" id="timerStat">TIME <span id="timerVal">30.0</span></div>
</div>

<div id="menu" class="overlay">
  <canvas id="coverCanvas"></canvas>
  <div class="menu-content">
    <h1>STAR TRAIL</h1>
    <p class="subtitle">SURVIVE THE ASTEROID FIELD</p>
    <p class="instructions">
      Drag or use arrow keys to navigate<br>
      Dodge the red asteroids<br>
      Collect golden energy cores<br>
      Survive for 30 seconds
    </p>
    <p class="best-score" id="menuBest">HIGH SCORE: 0</p>
    <button class="btn" id="startBtn">START</button>
  </div>
</div>

<div id="gameover" class="overlay hidden">
  <h2>GAME OVER</h2>
  <div class="final-score" id="finalScore">0</div>
  <div class="label">ENERGY CORES COLLECTED</div>
  <div class="best-score" id="overBest">BEST: 0</div>
  <button class="btn" id="againBtn">PLAY AGAIN</button>
</div>

<script>
window.onerror = function(msg, url, line) {
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:rgba(255,0,0,0.9);color:#fff;padding:10px;font-size:12px;z-index:99999;word-break:break-all;';
  d.textContent = 'Error: ' + msg + ' (line ' + line + ')';
  document.body.appendChild(d);
};

(function() {
  'use strict';

  var GAME_DURATION = 30;
  var PLAYER_RADIUS = 14;
  var PLAYER_HIT_RADIUS = 10;
  var PLAYER_SPEED = 0.28;
  var OBSTACLE_BASE_SPEED = 0.14;
  var OBSTACLE_SPAWN_INTERVAL = 900;
  var CORE_SPAWN_INTERVAL = 1600;
  var CORE_RADIUS = 10;
  var CORE_PICKUP_BONUS = 6;
  var STAR_COUNT = 80;

  var canvas = document.createElement('canvas');
  var ctx = canvas.getContext('2d');
  document.body.insertBefore(canvas, document.body.firstChild);

  var W = 480, H = 800;
  function resize() {
    W = canvas.width = Math.min(window.innerWidth || 480, 480);
    H = canvas.height = window.innerHeight || 800;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    var cc = document.getElementById('coverCanvas');
    if (cc) {
      cc.width = window.innerWidth || 480;
      cc.height = window.innerHeight || 800;
    }
  }
  window.addEventListener('resize', resize);
  resize();

  var state = 'menu';
  var player = { x: W / 2, y: H - 80, targetX: W / 2, r: PLAYER_HIT_RADIUS };
  var obstacles = [];
  var cores = [];
  var stars = [];
  var particles = [];
  var score = 0;
  var timeLeft = GAME_DURATION;
  var lastTime = 0;
  var obstacleTimer = 0;
  var coreTimer = 0;
  var dragActive = false;
  var keys = {};
  var shakeTime = 0;
  var coverMeteors = [];

  function initStars() {
    stars = [];
    for (var i = 0; i < STAR_COUNT; i++) {
      stars.push({
        x: Math.random() * W, y: Math.random() * H,
        r: Math.random() * 1.5 + 0.3,
        speed: Math.random() * 0.04 + 0.01,
        alpha: Math.random() * 0.6 + 0.2
      });
    }
  }

  function spawnParticles(x, y, color, count) {
    for (var i = 0; i < count; i++) {
      var angle = Math.random() * Math.PI * 2;
      var speed = Math.random() * 0.3 + 0.1;
      particles.push({
        x: x, y: y,
        vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        life: 1, decay: 0.02 + Math.random() * 0.02,
        color: color, r: Math.random() * 3 + 1
      });
    }
  }

  function resetGame() {
    player.x = W / 2; player.y = H - 80; player.targetX = W / 2;
    obstacles = []; cores = []; particles = [];
    score = 0; timeLeft = GAME_DURATION;
    obstacleTimer = 0; coreTimer = 0; keys = {}; shakeTime = 0;
    initStars(); updateHUD();
  }

  function updateHUD() {
    document.getElementById('scoreVal').textContent = score;
    document.getElementById('timerVal').textContent = timeLeft.toFixed(1);
    var ts = document.getElementById('timerStat');
    if (timeLeft <= 5) ts.classList.add('warning');
    else ts.classList.remove('warning');
  }

  function spawnObstacle() {
    var radius = Math.random() * 16 + 10;
    obstacles.push({
      x: Math.random() * (W - radius * 2) + radius, y: -radius,
      r: radius, speed: OBSTACLE_BASE_SPEED + Math.random() * 0.1,
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.002,
      shape: Math.floor(Math.random() * 3)
    });
  }

  function spawnCore() {
    cores.push({
      x: Math.random() * (W - CORE_RADIUS * 4) + CORE_RADIUS * 2,
      y: -CORE_RADIUS, r: CORE_RADIUS, speed: 0.1, pulse: 0
    });
  }

  function drawCover() {
    var cc = document.getElementById('coverCanvas');
    if (!cc) return;
    var cCtx = cc.getContext('2d');
    var CW = cc.width, CH = cc.height;
    if (CW <= 0 || CH <= 0) return;

    cCtx.clearRect(0, 0, CW, CH);

    var bgGrad = cCtx.createRadialGradient(CW * 0.7, CH * 0.25, 0, CW * 0.7, CH * 0.25, CH * 0.9);
    bgGrad.addColorStop(0, 'rgba(40,40,100,0.6)');
    bgGrad.addColorStop(1, 'rgba(5,5,20,0)');
    cCtx.fillStyle = bgGrad;
    cCtx.fillRect(0, 0, CW, CH);

    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      cCtx.beginPath();
      cCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      cCtx.fillStyle = 'rgba(180,200,255,' + s.alpha + ')';
      cCtx.fill();
    }

    var planetX = CW * 0.7, planetY = CH * 0.25, planetR = Math.min(CW, CH) * 0.35;
    if (planetR <= 0) return;

    var glow = cCtx.createRadialGradient(planetX, planetY, planetR * 0.8, planetX, planetY, planetR * 1.6);
    glow.addColorStop(0, 'rgba(100,150,255,0.25)');
    glow.addColorStop(1, 'rgba(100,150,255,0)');
    cCtx.fillStyle = glow;
    cCtx.beginPath(); cCtx.arc(planetX, planetY, planetR * 1.6, 0, Math.PI * 2); cCtx.fill();

    var planetGrad = cCtx.createRadialGradient(planetX - planetR * 0.3, planetY - planetR * 0.3, planetR * 0.1, planetX, planetY, planetR);
    planetGrad.addColorStop(0, '#5a7fb5');
    planetGrad.addColorStop(0.7, '#1e2a4a');
    planetGrad.addColorStop(1, '#0a0f1e');
    cCtx.fillStyle = planetGrad;
    cCtx.beginPath(); cCtx.arc(planetX, planetY, planetR, 0, Math.PI * 2); cCtx.fill();

    cCtx.save();
    cCtx.translate(planetX, planetY); cCtx.rotate(-0.3);
    cCtx.beginPath(); cCtx.ellipse(0, 0, planetR * 1.5, planetR * 0.2, 0, 0, Math.PI * 2);
    cCtx.strokeStyle = 'rgba(150,200,255,0.35)'; cCtx.lineWidth = 3; cCtx.stroke();
    cCtx.beginPath(); cCtx.ellipse(0, 0, planetR * 1.7, planetR * 0.25, 0, 0, Math.PI * 2);
    cCtx.strokeStyle = 'rgba(150,200,255,0.15)'; cCtx.lineWidth = 1.5; cCtx.stroke();
    cCtx.restore();

    if (coverMeteors.length === 0) {
      for (var m = 0; m < 10; m++) {
        coverMeteors.push({
          x: Math.random() * CW, y: Math.random() * CH,
          len: Math.random() * 80 + 40,
          speed: Math.random() * 0.6 + 0.3,
          alpha: Math.random() * 0.4 + 0.2
        });
      }
    }
    for (var mi = 0; mi < coverMeteors.length; mi++) {
      var met = coverMeteors[mi];
      met.x -= met.speed * 0.6; met.y += met.speed;
      if (met.y > CH || met.x < -met.len) {
        met.x = CW + met.len; met.y = -met.len;
        met.len = Math.random() * 80 + 40;
        met.speed = Math.random() * 0.6 + 0.3;
      }
      cCtx.beginPath();
      cCtx.moveTo(met.x, met.y);
      cCtx.lineTo(met.x + met.len, met.y - met.len * 0.5);
      var metGrad = cCtx.createLinearGradient(met.x, met.y, met.x + met.len, met.y - met.len * 0.5);
      metGrad.addColorStop(0, 'rgba(180,220,255,0)');
      metGrad.addColorStop(1, 'rgba(180,220,255,' + met.alpha + ')');
      cCtx.strokeStyle = metGrad; cCtx.lineWidth = 2; cCtx.stroke();
    }
  }

  function handlePointerStart(e) {
    if (state !== 'playing') return;
    dragActive = true; updatePointerX(e);
  }
  function handlePointerMove(e) {
    if (!dragActive || state !== 'playing') return;
    updatePointerX(e);
  }
  function handlePointerEnd() { dragActive = false; }

  function updatePointerX(e) {
    var rect = canvas.getBoundingClientRect();
    var clientX = e.touches ? e.touches[0].clientX : e.clientX;
    player.targetX = Math.max(PLAYER_RADIUS, Math.min(W - PLAYER_RADIUS, clientX - rect.left));
  }

  canvas.addEventListener('touchstart', function(e) { e.preventDefault(); handlePointerStart(e); }, { passive: false });
  canvas.addEventListener('touchmove', function(e) { e.preventDefault(); handlePointerMove(e); }, { passive: false });
  canvas.addEventListener('touchend', handlePointerEnd);
  canvas.addEventListener('mousedown', handlePointerStart);
  window.addEventListener('mousemove', handlePointerMove);
  window.addEventListener('mouseup', handlePointerEnd);

  window.addEventListener('keydown', function(e) {
    keys[e.key] = true;
    if (e.key === ' ') e.preventDefault();
    if ((e.key === 'Enter' || e.key === ' ') && state === 'menu') startGame();
    if ((e.key === 'Enter' || e.key === ' ') && state === 'ended') startGame();
  });
  window.addEventListener('keyup', function(e) { keys[e.key] = false; });

  function circleHit(ax, ay, ar, bx, by, br) {
    var dx = ax - bx, dy = ay - by, rr = ar + br;
    return dx * dx + dy * dy < rr * rr;
  }

  function update(dt) {
    if (state !== 'playing') return;
    timeLeft -= dt / 1000;
    if (timeLeft <= 0) { timeLeft = 0; endGame(); return; }

    if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.targetX -= PLAYER_SPEED * dt;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) player.targetX += PLAYER_SPEED * dt;
    player.targetX = Math.max(PLAYER_RADIUS, Math.min(W - PLAYER_RADIUS, player.targetX));
    player.x += (player.targetX - player.x) * Math.min(1, dt * 0.015);
    if (shakeTime > 0) shakeTime -= dt;

    for (var i = 0; i < stars.length; i++) {
      stars[i].y += stars[i].speed * dt;
      if (stars[i].y > H) { stars[i].y = -2; stars[i].x = Math.random() * W; }
    }

    obstacleTimer += dt;
    var spawnRate = Math.max(400, OBSTACLE_SPAWN_INTERVAL - (GAME_DURATION - timeLeft) * 30);
    if (obstacleTimer > spawnRate) { obstacleTimer = 0; spawnObstacle(); }

    coreTimer += dt;
    if (coreTimer > CORE_SPAWN_INTERVAL) { coreTimer = 0; spawnCore(); }

    for (var j = obstacles.length - 1; j >= 0; j--) {
      var o = obstacles[j];
      o.y += o.speed * dt; o.rotation += o.rotSpeed * dt;
      if (circleHit(player.x, player.y, player.r, o.x, o.y, o.r * 0.85)) {
        spawnParticles(player.x, player.y, '#ff6b6b', 30);
        shakeTime = 300; endGame(); return;
      }
      if (o.y > H + o.r * 2) obstacles.splice(j, 1);
    }

    for (var k = cores.length - 1; k >= 0; k--) {
      var c = cores[k];
      c.y += c.speed * dt; c.pulse += dt * 0.005;
      if (circleHit(player.x, player.y, player.r, c.x, c.y, c.r + CORE_PICKUP_BONUS)) {
        score += 1; spawnParticles(c.x, c.y, '#ffd166', 15);
        cores.splice(k, 1); updateHUD(); continue;
      }
      if (c.y > H + c.r * 2) cores.splice(k, 1);
    }

    for (var p = particles.length - 1; p >= 0; p--) {
      var pt = particles[p];
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      pt.life -= pt.decay * dt * 0.06;
      if (pt.life <= 0) particles.splice(p, 1);
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (shakeTime > 0) {
      var shake = shakeTime / 300 * 8;
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    var bgGrad = ctx.createRadialGradient(W/2, 0, 0, W/2, H, H);
    bgGrad.addColorStop(0, 'rgba(30,30,80,0.3)');
    bgGrad.addColorStop(1, 'rgba(5,5,20,0)');
    ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);

    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(180,200,255,' + s.alpha + ')'; ctx.fill();
    }

    for (var k = 0; k < cores.length; k++) {
      var c = cores[k];
      var glow = 0.6 + Math.sin(c.pulse) * 0.4;
      ctx.beginPath(); ctx.arc(c.x, c.y, c.r + 8, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,209,102,' + (glow * 0.3) + ')'; ctx.fill();
      ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
      ctx.fillStyle = '#ffd166'; ctx.fill();
      ctx.beginPath(); ctx.arc(c.x - 2, c.y - 2, c.r * 0.35, 0, Math.PI * 2);
      ctx.fillStyle = '#fff8e0'; ctx.fill();
    }

    for (var j = 0; j < obstacles.length; j++) {
      var o = obstacles[j];
      ctx.save();
      ctx.translate(o.x, o.y); ctx.rotate(o.rotation);
      ctx.beginPath();
      if (o.shape === 0) {
        var sides = 5 + Math.floor(o.r / 8);
        for (var n = 0; n < sides; n++) {
          var ang = (n / sides) * Math.PI * 2 - Math.PI / 2;
          var px = Math.cos(ang) * o.r, py = Math.sin(ang) * o.r;
          if (n === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
      } else if (o.shape === 1) {
        ctx.arc(0, 0, o.r, 0, Math.PI * 2);
      } else {
        ctx.moveTo(0, -o.r); ctx.lineTo(o.r * 0.7, 0);
        ctx.lineTo(0, o.r); ctx.lineTo(-o.r * 0.7, 0); ctx.closePath();
      }
      var grad = ctx.createRadialGradient(-o.r * 0.3, -o.r * 0.3, o.r * 0.1, 0, 0, o.r);
      grad.addColorStop(0, '#ff8a8a');
      grad.addColorStop(0.6, '#cc3333');
      grad.addColorStop(1, '#661111');
      ctx.fillStyle = grad; ctx.fill();
      ctx.strokeStyle = 'rgba(255,120,120,0.5)'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.restore();
    }

    for (var p = 0; p < particles.length; p++) {
      var pt = particles[p];
      ctx.globalAlpha = Math.max(0, pt.life);
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r * pt.life, 0, Math.PI * 2);
      ctx.fillStyle = pt.color; ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (state === 'playing' || state === 'ended') {
      ctx.save();
      ctx.translate(player.x, player.y);
      var flameLen = 14 + Math.random() * 10;
      ctx.beginPath(); ctx.moveTo(-6, 12); ctx.lineTo(0, 12 + flameLen); ctx.lineTo(6, 12); ctx.closePath();
      var flameGrad = ctx.createLinearGradient(0, 12, 0, 12 + flameLen);
      flameGrad.addColorStop(0, 'rgba(100,200,255,0.9)');
      flameGrad.addColorStop(1, 'rgba(100,200,255,0)');
      ctx.fillStyle = flameGrad; ctx.fill();

      ctx.beginPath();
      ctx.moveTo(0, -PLAYER_RADIUS - 2);
      ctx.lineTo(PLAYER_RADIUS * 0.9, PLAYER_RADIUS * 0.8);
      ctx.lineTo(0, PLAYER_RADIUS * 0.35);
      ctx.lineTo(-PLAYER_RADIUS * 0.9, PLAYER_RADIUS * 0.8);
      ctx.closePath();
      var bodyGrad = ctx.createLinearGradient(0, -PLAYER_RADIUS, 0, PLAYER_RADIUS);
      bodyGrad.addColorStop(0, '#a8e6ff');
      bodyGrad.addColorStop(0.5, '#5b8cff');
      bodyGrad.addColorStop(1, '#2a4a99');
      ctx.fillStyle = bodyGrad; ctx.fill();
      ctx.strokeStyle = 'rgba(180,220,255,0.8)'; ctx.lineWidth = 1.5; ctx.stroke();

      ctx.beginPath(); ctx.arc(0, -4, 4, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(180,240,255,1)'; ctx.fill();
      ctx.restore();
    }
    ctx.restore();

    if (state === 'ended') {
      ctx.fillStyle = 'rgba(5,5,20,0.6)'; ctx.fillRect(0, 0, W, H);
    }
  }

  function loop(timestamp) {
    var dt = Math.min(lastTime ? timestamp - lastTime : 16, 50);
    lastTime = timestamp;
    if (state === 'menu') { drawCover(); }
    else { update(dt); draw(); }
    requestAnimationFrame(loop);
  }

  function startGame() {
    resetGame(); state = 'playing'; lastTime = 0;
    document.getElementById('menu').classList.add('hidden');
    document.getElementById('gameover').classList.add('hidden');
    document.getElementById('hud').classList.add('active');
    updateHUD();
  }

  function endGame() {
    state = 'ended';
    var best = 0;
    try {
      best = parseInt(localStorage.getItem('starTrailBest') || '0', 10);
      if (score > best) { best = score; localStorage.setItem('starTrailBest', best); }
    } catch (e) {}
    document.getElementById('finalScore').textContent = score;
    document.getElementById('overBest').textContent = 'BEST: ' + best;
    document.getElementById('gameover').classList.remove('hidden');
    document.getElementById('hud').classList.remove('active');
  }

  function updateMenuBest() {
    try {
      var best = localStorage.getItem('starTrailBest');
      if (best) document.getElementById('menuBest').textContent = 'HIGH SCORE: ' + best;
    } catch (e) {}
  }

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('againBtn').addEventListener('click', startGame);

  initStars();
  updateMenuBest();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
